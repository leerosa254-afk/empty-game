<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>이심전심 감정탐정 2.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"><script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <main>
    <section id="lobby" class="screen active center">
      <div class="hero"><div class="float">💗</div><h1>이심전심<br><b>감정탐정 2.0</b></h1><p>친구의 표현 속 마음 단서를 찾아봐!</p>
        <div class="panel form"><input id="name" maxlength="15" placeholder="내 이름(별명)"><button id="create" class="yellow">👑 방 만들기</button>
          <div class="row"><input id="code" maxlength="4" placeholder="참여 코드"><button id="join" class="blue">입장</button></div>
        </div><button id="resume" class="ghost hidden">진행 중인 게임으로 돌아가기</button>
      </div>
    </section>

    <section id="waiting" class="screen blue-bg">
      <div class="wrap"><header class="top dark"><div><h2>대기실</h2><small>친구들에게 참여 코드를 알려주세요.</small></div><div class="code-box"><small>참여 코드</small><strong id="roomCode"></strong></div></header>
        <div class="panel grow"><h3>참가자 <span id="count"></span></h3><div id="players" class="players"></div></div>
        <div class="actions"><label>라운드 <select id="rounds"><option>3</option><option selected>5</option><option>10</option><option>15</option><option>20</option></select></label><button id="start" class="pink hidden">▶ 게임 시작</button><p id="waitMsg">방장이 시작하길 기다리는 중…</p></div>
      </div>
    </section>

    <section id="game" class="screen">
      <div class="game-wrap">
        <header class="top"><span class="pill">ROUND <b id="round"></b></span><span>표현자: <b id="drawer"></b></span><span class="timer">⏱ <b id="timer"></b></span></header>
        <div class="mission panel"><div><small id="roleLabel"></small><h2 id="situation"></h2></div><div class="mode">이번 미션 <b id="mode"></b></div><div id="secret" class="secret hidden">🔐 표현할 감정 <b id="emotion"></b></div></div>
        <div id="work" class="work">
          <div id="expression" class="panel expression">
            <div id="clueBox"><h3>감정 단어를 쓰지 않고 표현해 주세요.</h3><div class="row"><input id="clue" maxlength="100" placeholder="말·이모지·행동이나 대사로 표현"><button id="sendClue" class="orange">표현 보내기</button></div><div id="clueView" class="clue-view"></div></div>
            <div id="canvasBox" class="canvas-box hidden"><canvas id="canvas"></canvas><div class="tools"><button data-color="#172554" class="dot navy"></button><button data-color="#ef476f" class="dot red"></button><button data-color="#118ab2" class="dot sky"></button><button data-color="#06d6a0" class="dot green"></button><button data-color="#ffd166" class="dot yellow-dot"></button><button id="eraser">지우개</button><button id="clear">전체삭제</button></div></div>
          </div>
          <aside id="choiceArea" class="side">
            <div class="panel"><h3>친구가 표현한 감정은?</h3><div id="choices" class="choices"></div><h4>어떤 단서를 보고 알았나요?</h4><div id="reasons" class="reasons"><button>표정</button><button>말</button><button>행동</button><button>상황</button></div><button id="submitGuess" class="blue wide">선택하기</button><p id="guessDone" class="done hidden">✓ 추리를 제출했어요</p></div>
            <div class="panel"><h3>그런데 나라면? <small>최대 2개</small></h3><div id="allEmotions" class="emotion-grid"></div><button id="submitSelf" class="yellow wide">내 감정 보내기</button><p id="selfDone" class="done hidden">✓ 내 감정을 제출했어요</p></div>
          </aside>
        </div>
      </div>
    </section>

    <section id="reveal" class="screen reveal-bg"><div class="reveal-wrap"><h1>같은 상황, 다른 마음 💭</h1><div class="panel"><p id="answer"></p><div id="bars" class="bars"></div><p class="lesson">같은 일을 겪어도 서로 다른 감정을 느낄 수 있어요.</p></div><div id="scores" class="scores"></div><button id="next" class="pink hidden">다음 라운드 ▶</button></div></section>
    <section id="finished" class="screen dark-bg center"><div class="finish"><h1>게임 종료! 🎉</h1><div id="finalScores" class="panel scores"></div><button onclick="localStorage.removeItem('emotionSession');location.reload()" class="pink">처음으로</button></div></section>
  </main><div id="toast"></div><script src="app.js"></script>
</body></html>
